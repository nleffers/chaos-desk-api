version: 2
updates:
  # Ruby Gems (Gemfile & Gemfile.lock)
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Group minor/patch updates to reduce PR noise
    groups:
      rails-ecosystem:
        patterns:
          - "rails*"
          - "action*"
          - "active*"
        update-types:
          - "minor"
          - "patch"
      rubocop:
        patterns:
          - "rubocop*"

  # GitHub Actions (.github/workflows)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
